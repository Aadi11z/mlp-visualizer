# fly.toml — one-shot Fly.io deploy.
# After editing `app =` to a unique name, run: fly launch --copy-config --no-deploy
# Then:  fly secrets set OPENROUTER_API_KEY=sk-or-v1-...
# Then:  fly deploy

app = "mlp-tutor"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MLP_PORT = "9000"
  FRONTEND_DIST = "/app/frontend/dist"
  OPENROUTER_MODEL = "openai/gpt-4o-mini"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
