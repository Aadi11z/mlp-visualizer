[package]
name = "mlp-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rand = { version = "0.9.2", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.9"
rand_distr = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
