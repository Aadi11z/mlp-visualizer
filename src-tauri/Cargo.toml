[package]
name = "mlp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "mlp-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9.2"
rand_distr = "0.5.1"
rand_chacha = "0.9"
